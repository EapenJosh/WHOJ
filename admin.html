<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WHOJ Quick Links Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,700;6..12,900&display=swap">
<style>
:root {
  --bg: #0e1616; --surface: #142020; --fg: #e4eded; --muted: #8da1a1; --line: #263636;
  --accent: #94e3e3; --accent-fill: #009494; --deep: #004343; --on-fill: #ffffff; --off: #c9a46a;
  --font: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-weight: 300; display: flex; flex-direction: column; }
header { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; }
h1 { margin: 0; font-weight: 900; font-size: 1.5rem; }
.badge { background: var(--off); color: var(--bg); font-weight: 900; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
input[type="datetime-local"] { font: inherit; font-size: 1rem; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--fg); background: var(--surface); border: 1px solid var(--line); padding: 9px 12px; }
button { font: inherit; font-size: .88rem; font-weight: 700; color: var(--fg); background: var(--surface); border: 1px solid var(--line); padding: 9px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-fill); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; }
.seg button + button { border-left: 0; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.presets .lbl { width: 100%; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.presets button.brk { border-left: 3px solid var(--off); }
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; background: #0a1010; padding: 16px; overflow: auto; }
iframe { border: 1px solid var(--line); background: var(--bg); width: 100%; height: 100%; min-height: 600px; }
iframe.phone { width: 400px; max-width: 100%; }
.gate { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
.gatebox { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
.gatebox h1 { font-size: 1.8rem; }
.gatebox input { font: inherit; font-size: 1rem; font-weight: 400; color: var(--fg); background: var(--surface); border: 1px solid var(--line); padding: 10px 12px; text-transform: none; letter-spacing: 0; }
.err { margin: 0; color: var(--off); font-weight: 700; }
#app[hidden] { display: none !important; }
.open { color: var(--accent); font-weight: 700; font-size: .9rem; }
</style>
</head>
<body>
<main class="gate" id="gate">
  <form id="gateForm" class="gatebox">
    <h1>Admin</h1>
    <label for="pw">Password
      <input id="pw" type="password" autocomplete="current-password" required>
    </label>
    <p class="err" id="err" hidden>That password isn't right. Try again.</p>
    <button type="submit" class="on">Unlock</button>
    <a class="open" href="./">← Back to Quick Links</a>
  </form>
</main>
<div id="app" hidden style="display:contents">
<header>
  <div class="title">
    <h1>Page preview</h1>
    <span class="badge">Admin</span>
    <a class="open" id="openLink" href="index.html" target="_blank" rel="noopener">Open this preview in a new tab →</a>
  </div>
  <div class="controls">
    <label for="at">Michigan date and time
      <input id="at" type="datetime-local">
    </label>
    <div class="seg" role="group" aria-label="Screen size">
      <button type="button" id="phoneBtn">Phone</button>
      <button type="button" id="deskBtn" class="on">Desktop</button>
    </div>
    <button type="button" id="nowBtn">Right now</button>
    <button type="button" id="lockBtn">Lock</button>
  </div>
  <div class="presets" id="presets"><span class="lbl">Quick checks</span></div>
</header>
<div class="stage"><iframe id="frame" title="Quick Links preview"></iframe></div>
</div>

<script src="breaks.js"></script>
<script>
const atEl = document.getElementById("at"), frame = document.getElementById("frame"), openLink = document.getElementById("openLink");
const pad = n => String(n).padStart(2, "0");
const miNow = () => {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: "America/Detroit", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}T${pad(p.hour % 24)}:${p.minute}`;
};
const nextWeekday = (dow, time) => { /* dow: 0 Sun ... 6 Sat, in Michigan time */
  const today = miNow().slice(0, 10), d = new Date(today + "T12:00:00Z");
  let add = (dow - d.getUTCDay() + 7) % 7 || 7; d.setUTCDate(d.getUTCDate() + add);
  return d.toISOString().slice(0, 10) + "T" + time;
};
function load(v) {
  atEl.value = v;
  const url = "index.html?at=" + encodeURIComponent(v);
  frame.src = url; openLink.href = url;
}
atEl.addEventListener("change", () => atEl.value && load(atEl.value));
document.getElementById("nowBtn").addEventListener("click", () => load(miNow()));

const presets = document.getElementById("presets");
const add = (label, v, cls) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; if (cls) b.className = cls; b.addEventListener("click", () => load(v)); presets.appendChild(b); };
add("Weekday 7:59am (duty phone ending)", nextWeekday(3, "07:59"));
add("Weekday 8am (desk opens)", nextWeekday(3, "08:00"));
add("Weekday 7:59pm (desk closing)", nextWeekday(3, "19:59"));
add("Weekday 8pm (duty phone on)", nextWeekday(3, "20:00"));
add("Saturday 9am (duty phone, desk not open yet)", nextWeekday(6, "09:00"));
add("Saturday 10am (desk opens)", nextWeekday(6, "10:00"));
add("Saturday 6pm (desk closed, duty phone)", nextWeekday(6, "18:00"));
add("Monday 8am (weekend coverage ends)", nextWeekday(1, "08:00"));
(window.BREAKS || []).forEach(b => {
  add(`${b.name}: week before`, (() => { const d = new Date(b.start + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - 3); return d.toISOString().slice(0, 10) + "T12:00"; })(), "brk");
  add(`${b.name}: first day`, b.start + "T12:00", "brk");
  (b.deskClosedDays || []).forEach(([a]) => add(`${b.name}: desk closed`, a + "T12:00", "brk"));
});

const setSize = phone => { frame.classList.toggle("phone", phone); phoneBtn.classList.toggle("on", phone); deskBtn.classList.toggle("on", !phone); };
const phoneBtn = document.getElementById("phoneBtn"), deskBtn = document.getElementById("deskBtn");
phoneBtn.addEventListener("click", () => setSize(true));
deskBtn.addEventListener("click", () => setSize(false));

const KEY = "42a03c7096d17d62a3ef7b37940b86a07d4d6b1a069916d1091f759482be7d55";
const sha = async t => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2, "0")).join("");
const getTok = () => { try { return localStorage.getItem("whojAdmin"); } catch (e) { return null; } };
function unlock() { document.getElementById("pw").value = ""; document.getElementById("err").hidden = true; document.getElementById("gate").hidden = true; document.getElementById("app").hidden = false; load(miNow()); }
document.getElementById("gateForm").addEventListener("submit", async e => {
  e.preventDefault();
  const h = await sha(document.getElementById("pw").value);
  if (h === KEY) { try { localStorage.setItem("whojAdmin", h); } catch (e) {} unlock(); }
  else { document.getElementById("err").hidden = false; document.getElementById("pw").select(); }
});
document.getElementById("lockBtn").addEventListener("click", () => { try { localStorage.removeItem("whojAdmin"); } catch (e) {} location.reload(); });
if (getTok() === KEY) unlock(); else document.getElementById("pw").focus();
</script>
</body>
</html>
